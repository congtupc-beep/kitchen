<!DOCTYPE html>
<html>
<head>
    <title>Test API Orders</title>
</head>
<body>
    <h1>Test API Orders</h1>
    <button onclick="testAPI()">Test GET /api/orders/recent</button>
    <pre id="result"></pre>

    <script src="/assets/js/shared/api-client.js"></script>
    <script>
        async function testAPI() {
            try {
                const result = await window.apiClient.get('/orders/recent?limit=10');
                document.getElementById('result').textContent = JSON.stringify(result, null, 2);
            } catch (error) {
                document.getElementById('result').textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
