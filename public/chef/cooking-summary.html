<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng hợp chế biến - Hệ Thống Nhà Bếp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/headchef.css">
    
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="dashboard-layout-body">
    <aside class="kds-sidebar">
        <div>
            <div class="sidebar-brand">
                <i class="fa-solid fa-utensils"></i>
                <span>Món ngon mỗi ngày</span>
            </div>
            
            <nav class="sidebar-menu-list">
                <div class="menu-item-link" onclick="location.href='/chef/dashboard.html'">
                    <div class="link-main-content"><i class="fa-solid fa-chart-line"></i> Tổng quan</div>
                </div>
                
                <div class="menu-item-link active">
                    <div class="link-main-content"><i class="fa-solid fa-kitchen-set"></i> Quản lý hàng bếp</div>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div class="sub-menu-container">
                    <button class="btn-sub-badge" onclick="location.href='/chef/order-list.html'">
                        <i class="fa-solid fa-list"></i> Danh sách order
                    </button>
                    
                    <div class="menu-divider" style="margin: 8px 0; border-top: 1px dashed rgba(255,255,255,0.2);"></div>
                    
                    <button class="btn-sub-badge active status-tab" data-status="WAITING" onclick="cookingSummaryManager.switchStatus('WAITING', this)">
                        <i class="fa-solid fa-clock"></i> Đang chờ nấu
                    </button>
                    <button class="btn-sub-badge status-tab" data-status="COOKING" onclick="cookingSummaryManager.switchStatus('COOKING', this)">
                        <i class="fa-solid fa-fire-burner"></i> Đang nấu
                    </button>
                    <button class="btn-sub-badge status-tab" data-status="DONE" onclick="cookingSummaryManager.switchStatus('DONE', this)">
                        <i class="fa-solid fa-circle-check"></i> Hoàn thành
                    </button>
                </div>
            </nav>
        </div>
    </aside>

    <div class="kds-main-wrapper">
        <header class="kds-navbar">
            <div class="navbar-left">
                <h2><i class="fa-solid fa-fire-burner"></i> Tổng hợp chế biến</h2>
            </div>
            <div class="navbar-right">
                <div class="user-profile-block" onclick="location.href='/shared/profile.html'">
                    <img src="https://www.w3schools.com/howto/img_avatar.png" alt="Avatar" class="user-avatar">
                    <div class="user-info-text">
                        <span class="user-name" id="chefNameTxt">Đang tải...</span>
                        <span class="user-role" id="chefRoleTxt">Head Chef</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="workspace-content">
            <div class="cooking-summary-container">
                <div class="stats-grid">
                    <div class="stat-card" data-filter="total" onclick="cookingSummaryManager.toggleCardFilter('total', this)">
                        <div class="stat-icon" style="background: #e3f2fd; color: #1976d2;">
                            <i class="fa-solid fa-clipboard-list"></i>
                        </div>
                        <div class="stat-content">
                            <div class="stat-value" id="totalOrders">0</div>
                            <div class="stat-label">Tổng đơn đang chờ</div>
                        </div>
                    </div>
                    <div class="stat-card" data-filter="warning" onclick="cookingSummaryManager.toggleCardFilter('warning', this)">
                        <div class="stat-icon" style="background: #fff3e0; color: #f57c00;">
                            <i class="fa-solid fa-clock"></i>
                        </div>
                        <div class="stat-content">
                            <div class="stat-value" id="waitingOrders">0</div>
                            <div class="stat-label">Sắp quá hạn (5-15p)</div>
                        </div>
                    </div>
                    <div class="stat-card" data-filter="overdue" onclick="cookingSummaryManager.toggleCardFilter('overdue', this)">
                        <div class="stat-icon" style="background: #ffebee; color: #d32f2f;">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <div class="stat-content">
                            <div class="stat-value" id="overdueOrders">0</div>
                            <div class="stat-label">Đã quá hạn (>15p)</div>
                        </div>
                    </div>
                    <div class="stat-card" data-filter="new" onclick="cookingSummaryManager.toggleCardFilter('new', this)">
                        <div class="stat-icon" style="background: #e8f5e9; color: #388e3c;">
                            <i class="fa-solid fa-check-circle"></i>
                        </div>
                        <div class="stat-content">
                            <div class="stat-value" id="newOrders">0</div>
                            <div class="stat-label">Mới nhận (<5p)</div>
                        </div>
                    </div>
                </div>

                <div class="cooking-summary-layout">
                    <div class="dishes-section">
                        <h3 class="section-title" id="sectionTitle">Danh sách món Đang chờ nấu</h3>
                        <div class="dishes-grid" id="dishesGrid">
                            </div>
                    </div>

                    <div class="task-detail-panel" id="taskDetailPanel" hidden>
                        </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/assets/js/shared/api-client.js"></script>
    <script src="/assets/js/shared/auth.js"></script>
    <script src="/assets/js/shared/socket-client.js"></script>
    <script src="/assets/js/shared/toast.js"></script>
    <script src="/assets/js/chef/cooking-summary.js"></script>

    <!-- Task detail modal (dùng chung CSS từ headchef) -->
    <div class="dish-modal-overlay" id="taskDetailModalOverlay" onclick="if(event.target===this) cookingSummaryManager.closeTaskModal()">
        <div class="dish-modal-box" style="max-width:800px;">
            <div class="dish-modal-top">
                <h3><i class="fa-solid fa-fire-burner"></i> Chi tiết tác vụ chế biến</h3>
                <button class="dish-modal-close" onclick="cookingSummaryManager.closeTaskModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="taskDetailModalBody"></div>
        </div>
    </div>
    <style>
        .dish-modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1000;align-items:center;justify-content:center;padding:20px}
        .dish-modal-overlay.open{display:flex}
        .dish-modal-box{background:#fff;border-radius:20px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.25);animation:modalIn .22s ease}
        @keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .dish-modal-top{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #e1e4e8;position:sticky;top:0;background:#fff;z-index:1}
        .dish-modal-top h3{margin:0;font-size:16px;font-weight:700;color:#1a1a1a}
        .dish-modal-close{width:32px;height:32px;border-radius:50%;border:none;background:#f1f5f9;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#475569}
        .task-modal-layout{display:grid;grid-template-columns:200px 1fr;gap:24px;padding:24px 24px 0}
        .task-modal-img{width:100%;height:180px;border-radius:14px;background:#f0f4f8;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:48px;color:#cbd5e1}
        .task-modal-img img{width:100%;height:100%;object-fit:cover}
        .task-modal-section{margin-bottom:18px}
        .task-modal-section-title{font-size:12px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
        .task-modal-stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
        .task-modal-stat{background:#f6f8fa;border-radius:10px;padding:12px;text-align:center;border:1px solid #e1e4e8}
        .task-modal-stat-val{font-size:22px;font-weight:800;color:#0969da}
        .task-modal-stat-val small{font-size:12px;font-weight:400}
        .task-modal-stat-lbl{font-size:11px;color:#64748b;margin-top:2px}
        .task-modal-detail-rows{display:flex;flex-direction:column;gap:8px}
        .task-modal-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#f9fafb;border-radius:8px;font-size:13px}
        .task-modal-row-label{color:#64748b;font-weight:500}
        .task-modal-notes{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;font-size:13px;color:#92400e;line-height:1.6}
        .task-modal-allergy{background:#ffebe9;border:1px solid #ffcdd2;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;color:#cf222e;display:flex;align-items:center;gap:8px;margin-bottom:18px}
        .task-orders-list{display:flex;flex-direction:column;gap:10px}
        .task-order-card{border:1px solid #e1e4e8;border-radius:10px;overflow:hidden}
        .task-order-header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;background:#f6f8fa;border-bottom:1px solid #e1e4e8;font-size:13px}
        .task-order-id{font-weight:700;color:#1a1a1a}
        .task-order-time{color:#94a3b8;font-size:12px;margin-left:auto}
        .task-order-items{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
        .task-order-item{display:flex;align-items:center;gap:10px;font-size:13px}
        .task-item-qty{background:#0969da;color:#fff;font-weight:700;font-size:12px;padding:2px 8px;border-radius:20px;min-width:30px;text-align:center}
        .task-item-name{font-weight:600;color:#1a1a1a;flex:1}
        .task-item-note{color:#64748b;font-size:12px}
    </style>
    <script>
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && cookingSummaryManager) cookingSummaryManager.closeTaskModal();
        });
    </script>
</body>
</html>
