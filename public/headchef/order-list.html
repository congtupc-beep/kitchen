<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách Order - Hệ Thống Nhà Bếp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/headchef.css">
    
    <!-- ✅ QUAN TRỌNG: Thư viện Socket.io Client (TỰ ĐỘNG từ server) -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="dashboard-layout-body">
    <!-- Sidebar -->
    <aside class="kds-sidebar">
        <div>
            <div class="sidebar-brand">
                <i class="fa-solid fa-utensils"></i>
                <span>Món ngon mỗi ngày</span>
            </div>
            
            <nav class="sidebar-menu-list">
                <div class="menu-item-link" onclick="location.href='/headchef/dashboard.html'">
                    <div class="link-main-content"><i class="fa-solid fa-chart-line"></i> Tổng quan</div>
                </div>

                <div class="menu-item-link" onclick="location.href='/headchef/master-menu.html'">
                    <div class="link-main-content"><i class="fa-solid fa-book-open"></i> Thực đơn gốc</div>
                </div>

                <div class="menu-item-link">
                    <div class="link-main-content"><i class="fa-solid fa-list-check"></i> Quản lý thực đơn</div>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div class="sub-menu-container">
                    <button class="btn-sub-badge" onclick="location.href='/headchef/menu-daily.html'">
                        <i class="fa-solid fa-calendar-day"></i> Thực đơn hàng ngày
                    </button>
                </div>
                
                <div class="menu-item-link active">
                    <div class="link-main-content"><i class="fa-solid fa-kitchen-set"></i> Quản lý hàng bếp</div>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                <div class="sub-menu-container">
                    <button class="btn-sub-badge active" onclick="location.href='/headchef/order-list.html'">Danh sách order</button>
                    <button class="btn-sub-badge" onclick="location.href='/headchef/cooking-summary.html'">Tổng hợp chế biến</button>
                </div>
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="kds-main-wrapper">
        <header class="kds-navbar">
            <div class="navbar-left">
                <h2><i class="fa-solid fa-clipboard-list"></i> Danh sách order</h2>
            </div>
            <div class="navbar-right">
                <div class="user-profile-block" onclick="location.href='/shared/profile.html'">
                    <img src="https://www.w3schools.com/howto/img_avatar.png" alt="Avatar" class="user-avatar">
                    <div class="user-info-text">
                        <span class="user-name" id="chefNameTxt">Đang tải...</span>
                        <span class="user-role" id="chefRoleTxt">Head Chef</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="workspace-content">
            <div class="order-list-container">
                <!-- Left Panel: Order List -->
                <div class="order-list-panel">
                    <div class="order-list-header">
                        <div class="order-filters">
                            <button class="filter-btn active" data-filter="all">Tất cả</button>
                            <button class="filter-btn" data-filter="PENDING">Mới</button>
                            <button class="filter-btn" data-filter="PROCESSING">Đang nấu</button>
                            <button class="filter-btn" data-filter="DONE">Hoàn thành</button>
                        </div>
                        <div class="order-search">
                            <i class="fa-solid fa-search"></i>
                            <input type="text" id="orderSearch" placeholder="Tìm theo mã order, bàn...">
                        </div>
                    </div>
                    <div class="order-list-content" id="orderListContent">
                        <!-- Orders loaded by JS -->
                    </div>
                </div>

                <!-- Right Panel: Order Detail -->
                <div class="order-detail-panel" id="orderDetailPanel">
                    <div class="empty-state">
                        <i class="fa-solid fa-hand-pointer"></i>
                        <h3>Chọn một đơn hàng để xem chi tiết</h3>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts - Thứ tự quan trọng -->
    <script src="/assets/js/shared/api-client.js"></script>
    <script src="/assets/js/shared/auth.js"></script>
    <!-- ✅ Socket client đã có thể hoạt động vì đã load socket.io.js ở trên -->
    <script src="/assets/js/shared/socket-client.js"></script>
    <script src="/assets/js/shared/toast.js"></script>
    <script src="/assets/js/headchef/order-list.js"></script>
    <script>
        // Điều chỉnh link "Tổng quan" theo role sau khi DOM load
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('chef_user') || 'null');
            if (user && user.role === 'CHEF') {
                const overviewLink = document.querySelector('.menu-item-link[onclick*="dashboard"]');
                if (overviewLink) overviewLink.setAttribute('onclick', "location.href='/chef/dashboard.html'");
            }
        });
    </script>
</body>
</html>
